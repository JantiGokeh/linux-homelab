name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s controller -p 'test_*.py'
      - run: python -m unittest discover -s voice -p 'test_*.py'

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: ./scripts/check-public.sh

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: val-dashboard
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: val-dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
